<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vetta redesign — calm craft direction</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: #f4f4f2;
        color: #1a1a18;
        line-height: 1.5;
      }
      header {
        max-width: 960px;
        margin: 0 auto;
        padding: 32px 20px 20px;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        margin: 0 0 10px;
        color: #1a5340;
      }
      .lede {
        max-width: 58ch;
        margin: 0 0 16px;
        color: #333;
      }
      .links {
        font-size: 0.9rem;
        margin: 0 0 24px;
      }
      .links a {
        color: #1a5340;
        margin-right: 1rem;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        margin-bottom: 8px;
        font-size: 0.85rem;
      }
      nav a {
        color: #1a5340;
      }
      figure {
        max-width: 960px;
        margin: 0 auto 36px;
        padding: 0 16px;
      }
      figure.phone {
        max-width: 400px;
      }
      figcaption {
        font-size: 0.8rem;
        color: #555;
        margin: 0 0 8px;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
        border: 1px solid #ccc;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Calm craft direction</h1>
      <p class="lede">
        Middle path: real photo, sentence-case type, one green button, no stamps / collage / poster shouting.
        Still concept-only — and image generators still lean “AI”; treat these as a vibe check, not final art.
      </p>
      <p class="links">
        <a href="../index.html">Sparse set</a>
        <a href="../bold/index.html">Overdone set</a>
      </p>
      <nav>
        <a href="#home">Home</a>
        <a href="#kit">Kit</a>
        <a href="#blog">Blog</a>
        <a href="#email">Email</a>
        <a href="#book">Book</a>
        <a href="#about">About</a>
      </nav>
    </header>

    <figure id="home">
      <figcaption>C01 · Home</figcaption>
      <img src="c01-home.jpg" alt="Calm home" />
    </figure>
    <figure id="kit">
      <figcaption>C02 · Kit</figcaption>
      <img src="c02-kit.jpg" alt="Calm kit" />
    </figure>
    <figure id="blog">
      <figcaption>C03 · Blog</figcaption>
      <img src="c03-blog.jpg" alt="Calm blog" />
    </figure>
    <figure id="email" class="phone">
      <figcaption>C04 · Newsletter email</figcaption>
      <img src="c04-email.jpg" alt="Calm email" />
    </figure>
    <figure id="book">
      <figcaption>C05 · Book</figcaption>
      <img src="c05-book.jpg" alt="Calm book" />
    </figure>
    <figure id="about">
      <figcaption>C06 · About</figcaption>
      <img src="c06-about.jpg" alt="Calm about" />
    </figure>
  </body>
</html>
